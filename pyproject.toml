[project]
name = "logdigest"
dynamic = ["version"]
description = "Digest HTTP access logs into error rates per time bucket and noisiest endpoints."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []  # stdlib only
keywords = ["logs", "observability", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: System :: Logging",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=7", "mypy>=2", "ruff>=0.17"]

[project.scripts]
logdigest = "logdigest.cli:main"

[project.urls]
Homepage = "https://github.com/cilindrox/logdigest"
Repository = "https://github.com/cilindrox/logdigest"
Issues = "https://github.com/cilindrox/logdigest/issues"
Changelog = "https://github.com/cilindrox/logdigest/releases"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "logdigest.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
strict = true
files = ["src"]
python_version = "3.11"

[tool.ruff]
line-length = 80
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
