[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "logdigest"
version = "0.1.0"
description = "Digest HTTP access logs into error rates per time bucket and noisiest endpoints."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires_python = ">=3.11"
dependencies = []  # stdlib only
keywords = ["logs", "observability", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: System :: Logging",
]

[project.scripts]
logdigest = "logdigest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
strict = true
files = ["src"]
python_version = "3.11"

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
